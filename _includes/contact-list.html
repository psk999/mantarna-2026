{%- comment -%} Founder email contacts, as rows separated by rules. Emails live in _data/founders.yml. {%- endcomment -%}
<ul class="mt-9 max-w-2xl divide-y divide-line border-y border-line" aria-label="Contacts">
  {%- for f in site.data.founders %}
  <li><a class="group grid gap-x-6 gap-y-2 py-4 no-underline sm:grid-cols-[minmax(0,1fr)_auto] sm:items-center" href="mailto:{{ f.email }}">
    <span><span class="block font-serif text-xl text-ink">{{ f.name }}</span><span class="label mt-1 block">{{ f.role }}</span></span>
    <span class="inline-flex items-center gap-2 break-all text-[15px] font-medium text-muted group-hover:text-clay">{% include icon.html name="mail" %} {{ f.email }}</span>
  </a></li>
  {%- endfor %}
</ul>
