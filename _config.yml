title: Mantrana Healthcare
legal_name: Mantrana Healthcare Technology Pvt. Ltd.
short_name: Mantrana
tagline: Human Wisdom, Machine Intelligence
description: >-
  A collaborative healthcare transformation initiative connecting institutions, research,
  innovation, and digital technology for meaningful healthcare impact.
apply_url: https://forms.gle/EG3dn4emFdzqTNJM8
# Contact address: footer, contact lists, the join card, structured data and llms.txt
email: rrsmantrana@gmail.com
# Official profiles: shown in the footer and listed as sameAs in the structured data
social:
  - { name: LinkedIn, icon: linkedin, url: "https://www.linkedin.com/company/mantrana-healthtech/" }
baseurl: ""
# The live address: used for canonical links, share previews, the sitemap and structured data.
url: "https://mantranatech.ai"
lang: en-IN
# Cloudflare Web Analytics site token (public; no cookies, no consent banner needed). Remove to turn it off.
cf_analytics_token: a7895456bbdc4641bea3195f109ae041
markdown: kramdown
permalink: pretty

# Search, answer-engine and AI-crawler settings (_includes/seo.html, robots.txt, sitemap.xml, llms.txt).
seo:
  title: Mantrana Healthcare Technology
  image: /assets/img/og-mantrana.jpg        # 1200x630 share card
  image_alt: "Mantrana Healthcare Technology: Human Wisdom, Machine Intelligence"
  logo: /assets/img/mantrana-logo-square.png
  founded: "2025"
  topics: [Healthcare technology, Artificial intelligence in healthcare, Machine learning, Healthcare interoperability, HL7 FHIR, Digital pathology, Medical image analysis, Clinical decision support, Implementation research]
  partners: [Sri Sathya Sai Institute of Higher Learning (SSSIHL), Sri Sathya Sai Institute of Higher Medical Sciences (SSSIHMS), Sri Sathya Sai Research and Innovation Foundation (SSSRIF), SSSIHL Institution's Innovation Council (IIC), Sri Sathya Sai Biobank and Research Hub (SSSBRH)]

# When true (preview), every page asks search engines not to index it and robots.txt blocks crawlers.
# False (live): robots.txt allows search and AI crawlers and lists the sitemap.
noindex: false

defaults:
  - scope: { path: "" }
    values: { layout: default }

# _headers: security headers for Cloudflare (Jekyll skips files starting with _ unless listed)
include:
  - _headers

exclude:
  - Gemfile
  - Gemfile.lock
  - .ruby-version
  - wrangler.jsonc
  - deploy
  - bin
  - vendor
  - .gitignore
  - README.md
  - CLAUDE.md
