# Words for the About page (/about/), drawn from the company presentation (slides 3 and 6-13).
# Keep commercial plans, status reports and anything marked internal off the site; deploy/leak-scan.sh checks.

intro: >-
  Mantrana Healthcare Technology is a collaborative healthcare transformation company, bringing together
  SSSIHL, SSSIHMS, SSSRIF and IIC so that computational science reaches everyday clinical care.

story:
  heading: A legacy of computing and care
  milestones:
    - year: "1991"
      text: The first Sri Sathya Sai Institute of Higher Medical Sciences (SSSIHMS) hospital is inaugurated at Puttaparthi.
    - year: "1995"
      text: The Department of Mathematics and Computer Science (DMACS) is established at Sri Sathya Sai Institute of Higher Learning (SSSIHL).
    - year: ML · AI
      text: DMACS has focused on machine learning and artificial intelligence as key areas of applied research.
    - year: "2025"
      text: In the Centenary Year of Bhagawan's Birth, Mantrana Healthcare Technology takes that legacy forward.
  closing: >-
    The closeness of these two beginnings laid the foundation for a long-standing vision: to bridge
    computational sciences with healthcare.

approach:
  heading: Digital transformation in healthcare is the need of the hour
  items:
    - title: Knowledge from action
      icon: history
      text: Turning past experience into usable knowledge.
    - title: Knowledge for action
      icon: target
      text: Planning and organising for the future.
    - title: Knowledge in action
      icon: zap
      text: Adapting in the present, turning knowledge into skill.

flywheel:
  heading: Hyper-collaboration, a cycle that turns research into reality
  steps:
    - title: Deep academic inquiry
      where: SSSIHL
      icon: graduation-cap
      text: PhD-level research builds foundational knowledge and highly skilled talent.
    - title: Applied technology and data science
      where: Mantrana
      icon: chart-line
      text: That knowledge becomes practical tools, dashboards and predictive models.
    - title: Clinical implementation and impact
      where: SSSIHMS
      icon: heart-pulse
      text: The tools are deployed against real hospital challenges, improving patient outcomes and operational efficiency.
    - title: New challenges and data streams
      where: Back to research
      icon: refresh-cw
      text: The clinical setting surfaces new, complex problems and rich datasets that drive the next wave of inquiry.

# Frequently asked questions: shown on the About page and published as FAQPage structured data
# for search and answer engines. Keep answers factual and consistent with the rest of the site.
faq:
  - q: What is Mantrana Healthcare Technology?
    a: >-
      Mantrana Healthcare Technology Pvt. Ltd. is a collaborative healthcare transformation company,
      established in 2025, that brings together SSSIHL, SSSIHMS, SSSRIF and IIC. Guided by the idea
      "Human Wisdom, Machine Intelligence", it applies machine learning and artificial intelligence to
      healthcare technology, implementation research and innovation.
  - q: Who founded Mantrana?
    a: >-
      Mantrana was founded by Dr. Raghunatha Sarma R (Founder), a teacher and researcher in computer
      vision, machine learning and healthcare analytics with over three decades of experience, and
      Dr. P. Sunil Kumar (Co-founder), who brings over two decades of research in computer science,
      knowledge graphs and social security data mining.
  - q: What does the Mantrana technology platform do?
    a: >-
      The platform provides APIs for AI. It connects hospital data such as HIS, pathology, radiology,
      wearables, pharmacy and claims through open standards (HL7 FHIR, DICOM, IHE and SMART on FHIR)
      and organises it across enrolment, treatment and claims, for care apps, research platforms and
      diagnostics platforms. Mantrana enables these capabilities so research teams can use them as a
      public good. The team is also architecting a healthcare databank that will give researchers access
      to datasets of many types, collaborating with the Sri Sathya Sai Biobank and Research Hub.
  - q: What research is Mantrana working on?
    a: >-
      Three clinical applications are in development: early identification of cardiogenic brain abscess
      in Tetralogy of Fallot, outcome prediction for PTMC in mitral stenosis, and an explainable machine
      learning model for recurrent lumbar disc herniation. Sixteen hospital AI projects are in discussion
      with SSSIHMS, across radiology, scheduling, clinical documentation, patient communication and
      patient flow.
  - q: Can research scholars and graduates join Mantrana's research?
    a: >-
      Yes. Mantrana is open to collaborations and invites research scholars, M.Tech graduates and MS
      graduates to join the multi-year healthcare databank project, built with the Sri Sathya Sai
      Biobank and Research Hub. Email rrsmantrana@gmail.com to express interest.
  - q: How can students get involved with Mantrana?
    a: >-
      Students can apply for internships in web development, AI and data science, and healthcare
      technology through the Mantrana internship Google Form linked on the home page.
  - q: How do I contact Mantrana?
    a: >-
      For collaboration, internship coordination and institutional engagement, email
      rrsmantrana@gmail.com.
