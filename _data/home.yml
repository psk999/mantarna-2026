# Words for the home page (index.html). Edit here; the layout stays untouched.

lede: >-
  A collaborative healthcare transformation initiative connecting institutions, research,
  innovation, and digital technology for meaningful healthcare impact.

partners:
  - { name: SSSIHL, url: "https://sssihl.edu.in" }
  - { name: SSSIHMS, url: "https://whitefield.sssihms.org/" }
  - { name: SSSRIF, url: "https://sssrif.org/" }
  - { name: IIC, url: "https://iic.sssihl.edu.in/" }

pillars:
  - title: Vision
    text: Blending human wisdom with technology to support practical, collaborative healthcare transformation.
  - title: Collaboration
    text: Built through academic, clinical, research, and innovation partnerships that strengthen real-world impact.
  - title: Opportunity
    text: Students can engage through internships and contribute to meaningful healthcare technology initiatives.

about: >-
  Mantrana brings together human expertise and machine intelligence to support collaborative work in
  healthcare technology, implementation Research (IR) and innovation.

founders:
  - name: Dr. Raghunatha Sarma R
    role: Founder
    photo: /assets/img/raghunatha-sarma.jpg
    summary: >-
      An experienced teacher and a researcher with expertise in Computer Vision, Machine Learning and
      Data mining, and in Healthcare and Social welfare Analytics.
    bio:
      - >-
        With over three decades of academic and research experience, he has contributed significantly to
        interdisciplinary projects involving healthcare diagnostics, medical image analysis, and intelligent
        systems. His work spans point-of-care diagnostic devices, medical image segmentation,
        multi-resolution based image mosaicing, and interpretable machine learning frameworks for
        predictive analytics in neurosurgery, applied to conditions such as Chiari 1 malformation,
        cardiogenic brain abscess in Tetralogy of Fallot, recurrent lumbar disc herniation, and rheumatic
        heart disease with mitral stenosis.
      - >-
        He translated his doctoral research on satellite image stitching, done in collaboration with ISRO,
        into stitching high-resolution pathology slide images. He currently leads research in social
        security and welfare data mining of large healthcare schemes such as Ayushman Bharat, AI in sports,
        whole slide imaging for classifying disease from pathology slides, and thermal image analysis.
    areas: [Computer vision, Medical imaging, Interpretable ML, Digital pathology]
  - name: Dr. P. Sunil Kumar
    role: Co-founder
    photo: /assets/img/sunil-kumar.jpg
    summary: >-
      Brings over two decades of academic and research excellence in Computer Science, blending technical
      proficiency with a values-based approach.
    bio:
      - >-
        His core expertise spans programming, databases, embedded systems, and machine learning, with an
        emerging focus on Social Security Data Mining (SSDM). A key contributor to the Institute's innovation
        ecosystem, he drives strategic research in healthcare knowledge graphs, multilingual conversational
        agents, hybrid rule mining, and systems modelling, aimed at empowering digital public
        infrastructure and social impact initiatives.
      - >-
        His work includes knowledge graphs that link treatment, health schemes, insurance, and care
        pathways; multilingual conversational AI that improves healthcare awareness and scheme navigation
        in rural India; and data pipelines and decision-support tools that help doctors and surface
        underserved population segments.
    areas: [Knowledge graphs, Conversational AI, Data mining, Public health systems]

internships:
  intro: >-
    Students can apply through the Google Form to participate in technology, data, research, and
    healthcare-oriented internship work.
  areas:
    - title: Web Development
      text: Build and improve responsive website and interface components.
    - title: AI / Data Science
      text: Contribute to analytics, machine learning, and data-supported project activities.
    - title: Healthcare Technology
      text: Support healthcare-focused innovation and collaborative digital initiatives.

contact: >-
  For collaboration, internship coordination, and institutional engagement, please connect through the
  official Mantrana channels.
