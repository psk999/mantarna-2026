# Words for the Internships page (/internships/).
# Sources: the systems modelling framework and 16-week flows (social welfare analytics), the Research page
# data (AI in Health Care), and the questions on the application form (site.apply_url).

intro: >-
  Mantrana internships are research projects with a mentor, a weekly rhythm and real deliverables.
  Pick a track, check the skills each project needs, and tell us in the form what you would bring.

