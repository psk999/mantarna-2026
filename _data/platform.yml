# The Mantrana Technology Platform diagram (_includes/platform-diagram.html), redrawn from the
# company presentation ("Mantrana Technology Platform: APIs for AI").

heading: The Mantrana technology platform
sub: >-
  APIs for AI. One platform connects hospital data, through open healthcare standards, to every stage
  of a patient's care and the apps and platforms that use it.

# Banner above the diagram
powered:
  label: Powered by Mantrana
  text: >-
    Mantrana enables these capabilities, so that research teams can use them as a public good.

# Second platform capability, shown below the diagram
databank:
  label: Platform capability · In progress
  heading: A healthcare databank for researchers
  text: >-
    The team is architecting a healthcare databank that will give researchers access to datasets of
    many types, from one place.
  partner_label: Collaborating with
  partner: Sri Sathya Sai Biobank and Research Hub (SSSBRH)
  partner_url: https://iic.sssihl.edu.in/sri-sathya-sai-biobank-and-research-hub/
  partner_note: >-
    for the Sri Sathya Sai Healthcare Databank, which links biospecimens with clinical, imaging,
    multiomic and long-term outcome data.
  # Data lake behind the databank, top layer first (as published by SSSBRH)
  layers:
    - { name: Service layer, sub: For research and innovation, text: "Secure workspaces, governed access, AI and diagnostics pipelines" }
    - { name: Storage layer, sub: To approved standards, text: "OMOP and FHIR-aligned clinical, imaging and multiomic data" }
    - { name: Ingestion layer, sub: Data ingestion, text: "Clinical records, LIMS, imaging and sequencing feeds" }
  # The databank pipeline (illustrative, as published by SSSBRH): inputs -> 12 steps in 4 phases -> outputs
  pipeline:
    heading: From sample and record to research-ready data
    note: Illustrative; inputs vary by programme and study.
    inputs:
      - { name: Participant consent, detail: "e-Consent, scope, tiers" }
      - { name: Clinical records, detail: "EMR, diagnoses, medications, procedures" }
      - { name: Biospecimen accession, detail: "LIMS, barcode, aliquots, freezer" }
      - { name: Pathology and lab reports, detail: "DiagnosticReport, Observation" }
      - { name: Imaging, detail: "DICOM: retinal, cardiac, radiology" }
      - { name: Raw sequencing reads, detail: "FASTQ: WGS, WES, RNA-seq" }
      - { name: Proteomics and metabolomics, detail: "mzML, mass-spec runs" }
      - { name: AMR isolate data, detail: "Culture, AST, isolate genomes" }
      - { name: Longitudinal follow-up, detail: "Outcomes, recurrence, survival" }
      - { name: Participant identity, detail: "Pseudonymised ID, held separately" }
    phases:
      - name: Ingest and register
        steps:
          - { name: Consent check, text: Every record and sample gated by consent scope }
          - { name: Pseudonymise, text: Identity split from data; study IDs issued }
          - { name: Accession and QC, text: "Barcode, sample integrity and chain of custody" }
      - name: Harmonise clinical data
        steps:
          - { name: Map to standards, text: "SNOMED CT, LOINC and ICD-10 into OMOP and FHIR" }
          - { name: Link sample to phenotype, text: "Specimens joined to episodes, imaging and outcomes" }
      - name: Genomic and omics processing
        steps:
          - { name: Read QC and alignment, text: FASTQ to BAM against the reference genome }
          - { name: Variant calling, text: "SNVs, indels, CNVs and SVs into joint VCFs" }
          - { name: Annotation, text: Clinical significance and Indian population frequencies }
          - { name: Expression and proteomics, text: Transcript and protein abundance matrices }
          - { name: Pathogen genomics, text: "AMR genes, lineages and phylogeny for isolates" }
      - name: Curate and release
        steps:
          - { name: Feature store, text: "Versioned, analysis-ready datasets for AI and ML" }
          - { name: Governed release, text: "Tiered access, output review, provenance logged" }
    outputs:
      - { name: Analysis-ready cohorts, text: OMOP tables linked to the live sample inventory }
      - { name: Variant and genotype datasets, text: Annotated VCFs and genotype matrices for association studies }
      - { name: Multiomic matrices, text: "Expression, proteomic and metabolomic profiles per sample" }
      - { name: AMR and pathogen datasets, text: "Resistance genes, lineages and outbreak clusters" }
      - { name: AI training sets, text: "De-identified, labelled multimodal data with provenance" }
  join:
    heading: Join the databank project
    text: >-
      Mantrana is open to collaborations, and invites research scholars, M.Tech graduates and MS
      graduates to join the team and be part of this multi-year project.
    roles: [Research scholars, M.Tech graduates, MS graduates]
    term: Multi-year project
    subject: Joining the Mantrana health databank project

# "How it fits together", read along the diagram
walkthrough:
  - title: Connect hospital data
    icon: database
    text: Records flow in from hospital information systems, pathology and radiology labs, wearables, pharmacy and claims, over HL7 FHIR and DICOM.
  - title: Speak open standards
    icon: network
    text: An interoperability layer built on IHE, DICOM, SMART on FHIR and HL7 FHIR links on-premise HIS, PACS/RIS, lab and local IT systems.
  - title: Follow the care journey
    icon: layers
    text: Six layers, from data and services to language, protection and data mining, organise information across enrolment, treatment and claims.
  - title: Serve apps and research
    icon: sparkles
    text: APIs feed care provider and care consumer apps two ways, and share data with research and diagnostics platforms.

sources:
  title: EHR data sources
  items: [HIS, Pathology lab, Radiology lab, Wearables, Pharmacy, Claims]

stakeholders: [NHA, SHA, EHCP, DHU, PO]

stages:
  - { name: Enrolment stage, params: 14 }
  - { name: Treatment stage, params: 25 }
  - { name: Claim / utilisation stage, params: 18 }

# One row per layer; cells follow the stage order above.
layers:
  - name: Data
    cells:
      - Eligibility criteria and demographic details
      - Clinical records, hospitalisation data
      - Claims, utilisation, payment history
  - name: Service
    cells:
      - Verification, registration, e-Card
      - Pre-authorisation, admission, treatment
      - Claim processing, settlement
  - name: Modes
    cells:
      - Trust / insurance / mixed
      - Trust / insurance / mixed
      - Trust / insurance / mixed
  - name: Linguistic
    cells:
      - Multilingual support
      - Regional communication
      - Multilingual claims
  - name: Protection
    cells:
      - Authentication data of the beneficiaries
      - Data security, compliance, confidentiality
      - Privacy, financial security, accountability
  - name: Data mining
    ai: true
    cells:
      - Awareness pattern discovery, behavioural pattern mining, beneficiary segmentation based on services
      - Sentiment analysis, opinion mining, anomaly detection in service delivery
      - Fraud detection during claims processing, utilisation and payment trend analysis

interop:
  title: Interoperability and integration services
  standards: [IHE, DICOM, SMART on FHIR, HL7 FHIR]

link:
  title: Link
  items: [Python script, Interface engine, Interface engine + data store, DICOM connector]

onprem:
  title: On-premise
  items: [HIS, PACS / RIS, Lab, Local IT systems]

apps:
  title: Third-party apps
  items: [Care provider app, Care consumer app]

consumers:
  title: External data consumers
  items: [Research platforms, Diagnostics platforms]
